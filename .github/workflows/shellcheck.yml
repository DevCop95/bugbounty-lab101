name: Security and Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint, Security & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check LF line endings on code and workflow files
        run: |
          if git ls-files '*.sh' '*.py' '*.js' '*.yml' '*.yaml' | xargs grep -n $'\r'; then
            echo "::error::CRLF line endings detected in tracked code/workflow files (use LF)."
            exit 1
          fi

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "=== ShellCheck Analysis ==="
          ERRORS=0
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            if ! shellcheck -x -S warning "$script"; then
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "ShellCheck found issues in $ERRORS file(s)."
            exit 1
          else
            echo ""
            echo "All scripts passed ShellCheck."
          fi

      - name: Syntax check (Bash & Node)
        run: |
          echo "=== Bash & Node Syntax Check ==="
          find . -name "*.sh" -not -path "./.git/*" -exec bash -n {} \;
          node --check auto-scanner/integrations/browser_capture.js
          node -e '
            const assert = require("assert");
            const { redactHeaders } = require("./auto-scanner/integrations/browser_capture.js");
            const out = redactHeaders({ Authorization: "Bearer tok", Cookie: "a=1", "X-Other": "ok" });
            assert.strictEqual(out.Authorization, "[REDACTED]");
            assert.strictEqual(out.Cookie, "[REDACTED]");
            assert.strictEqual(out["X-Other"], "ok");
            const raw = redactHeaders({ Authorization: "Bearer tok" }, true);
            assert.strictEqual(raw.Authorization, "Bearer tok");
            console.log("browser_capture.js unit assertions passed.");
          '
          echo "All syntax and JS checks passed."

      - name: Python compile and tests
        run: |
          python3 -m compileall -q scripts auto-scanner/burp-integration tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Functional shell tests
        run: |
          bash tests/test-shell-scope.sh
          bash tests/test-pipeline-bugs.sh

      - name: Reject tracked raw evidence and private files
        run: bash scripts/check-sensitive-files.sh
